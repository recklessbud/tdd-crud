name: Build, Test and lint workflow

on:
  push:
    branches:
      - dev
  
jobs:
  finished:
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Finished
        run: echo "Finished✅✅"
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - run: |
        git fetch --prune --unshallow
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Run pip Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt
  
  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Lint code with ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .
      - name: Format with black
        run : |
          python -m pip install --upgrade pip
          pip install black
          black .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: Set up python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
        env:
          DB_URL: ${{ secrets.DB_URL }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      - name: test with pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest .


