name: Build, Test and lint workflow

on:
  push:
    branches:
      - dev
  
jobs:
  finished:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Finished
        run: echo "Finished✅✅"
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - run: |
        git fetch --prune --unshallow
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Run pip Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt      
    - name: Lint code with ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        ruff check .
    - name: Format with black
      run : |
        python -m pip install --upgrade pip
        pip install black
        black .
  

  test:
    runs-on: ubuntu-latest
    needs: build
    env: 
      DB_URL: "sqlite:///./test.db"
      GH_TOKEN: ${{ github.token}}
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: Set up python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt 
          pip install aiosqlite pytest
      - name: test with pytest
        run: |
          cd src && python -m pytest tests/

      - name: Dev Stage Pull Request
        run: |
          export PR_BRANCH=$(git branch --show-current)
          export DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          echo "$PR_BRANCH and $DEFAULT_BRANCH"
          export DEV_STAGE_INFO=dev
          gh pr create --title "Automated PR from Dev Stage" --body "$DEV_STAGE_INFO" --base $DEFAULT_BRANCH --head $PR_BRANCH --repo $GITHUB_REPOSITORY

