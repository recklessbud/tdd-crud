name: Build, Test and lint workflow

on:
  push:
    branches:
      - dev

jobs:
  build:
    permissions:
      contents: read
      actions: read
      security-events: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Fetch full history
        run: git fetch --prune --unshallow

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: pip install bandit bandit_sarif_formatter

      - name: Run Bandit
        run: |
          bandit -r src/ -f sarif \
            -o bandit.sarif \
            -l -i \
            --exit-zero

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit 

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config=auto \
            --sarif \
            . > semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep    # ← gives it a unique name in code scanner


  sca-scanning:
   permissions:
     contents: read
     security-events: write
     actions: read
   runs-on: ubuntu-latest
   needs: [build]
   steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: 'npm'
      - name: Install snyk
        run: npm install -g snyk

      - name: Run Snyk
        run:  snyk test --file=src/requirements.txt --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  finished:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [build]                     # ← only runs if build passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Finished
        run: echo "Finished✅✅"
   
   
   
   
   
   
