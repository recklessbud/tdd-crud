  trufflehog-scan:
    name: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v3
        name: TruffleHog OSS
        id: trufflehog
      - uses: trufflesecurity/trufflehog@add-actions-cli-switch
        continue-on-error: true
        with:
          path: ./
          base: "${{ github.event.repository.default_branch }}"
          head: HEAD
          extra_args: --debug --only-verified

      - name: Scan Results Status 
        if: steps.trufflehog.outcome == 'failure' 
        run: exit 1
  build:
    permissions:
      contents: read
      actions: read
      security-events: write

    runs-on: ubuntu-latest
    needs: [trufflehog-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch full history
        run: git fetch --prune --unshallow

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: pip install bandit bandit_sarif_formatter

      - name: Run Bandit
        run: |
          bandit -r src/ -f sarif \
            -o bandit.sarif \
            -l -i \
            --exit-zero

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config=auto \
            --sarif \
            . > semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca-scanning:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r src/requirements.txt
      - name: Install snyk
        run: npm install -g snyk
      - name: Run Snyk
        run: snyk test --file=src/requirements.txt --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  finished:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [sca-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Finished
        run: echo "Finished✅✅"

